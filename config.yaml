# Otto configuration — WIRING only (how voice/UI flows).
# Agent behavior (MCP servers, subagents, skills, CLAUDE.md, permissions) comes from your
# OWN Claude config — Otto loads it. Env vars (OTTO_*) override these values.
# When installed, the live copy lives at ~/Library/Application Support/Otto/config.yaml
# and is editable from the menu bar → Settings.

server:
  host: "127.0.0.1"
  port: 8000

brain:
  type: claude
  model: ""                    # blank = use Claude's default model
  # Session access level (change it in Settings → Session access level). Default for a fresh
  # install is 'guarded'. This machine is set to 'bypass' — full access, chosen deliberately.
  #   bypass  -> full access, never asks (SDK bypassPermissions)
  #   auto    -> alias of bypass (auto-approves everything; NOT a per-action callback)
  #   guarded -> do everything asked, but confirm genuinely DANGEROUS actions (destructive
  #              shell, delete/erase, outbound send, payments) by voice/screen  [default]
  #   voice   -> confirm every consequential action
  #   deny    -> block all writes/actions (read-only)
  # SECURITY: with server.allow_remote on, bypass/auto means a remote client with the token can
  # run anything as you — prefer guarded or voice, and keep the token secret.
  permission: bypass
  project_dir: "~"             # current project = the brain's working directory
  projects: []                 # pinned projects for the menu-bar switcher
  extra_dirs: []               # extra readable dirs beyond the project (~ expanded)
  use_claude_config: true      # load your ~/.claude settings, MCP, subagents, skills, CLAUDE.md
  continue_conversation: false  # resume project chat on launch (false = fresh each launch)
  register_mcp: true           # expose /mcp so `claude mcp add otto` gives Claude voice+screen
  # Agentic tools (browser / computer-use) whose actions run without a per-click spoken
  # confirm, so a computer-use loop isn't interrupted. Destructive shell + write connector
  # calls still confirm. Empty the list to force confirmation on everything.
  auto_allow_tools: ["mcp__playwright__", "mcp__computer-use__"]

memory:                        # persistent, cross-session memory (OTTO_HOME/memory)
  enabled: true                # master switch for the whole memory store
  inject: true                 # prepend durable facts + recent summary to every turn
  auto_capture: true           # after each turn, learn what's worth remembering (automatic)
  max_preamble_chars: 2000     # upper bound on the injected memory block
  max_summary_lines: 15        # how many recent one-line summaries to keep
  capture_model: "haiku"       # fast/cheap model for the background learn pass

voice:
  input_enabled: true          # microphone / wake word / push-to-talk
  output_enabled: true         # speak replies

  stt:
    model: "small.en"          # faster-whisper: tiny/base/small/medium/large-v3 (+ .en)
    language: "en"
    silence_seconds: 1.0    # pause (s) that ends your turn
    always_listen: false    # true = just talk, no wake word (mute the mic when not in use)
    refine: false           # clean filler/false-starts from the transcript before use (haiku)
    refine_model: "haiku"
    dictation_mode: false   # type speech into the focused app instead of sending to Claude
    # Wake word backend:
    #   efficientword -> BEST custom wake word: record your phrase a few times, no account,
    #                    no training. Run `python -m otto.enroll_wake_word "hey otto"`.
    #   phrase        -> software wake word: any phrase, zero setup, but rides on speech-to-
    #                    text so it can miss the trigger (default until you enroll).
    #   oww           -> openWakeWord built-in phrases ("hey jarvis", "alexa", …), or a
    #                    trained model via oww_model_path.
    #   pvporcupine   -> custom .ppn keyword + PICOVOICE_ACCESS_KEY (signup needs work email).
    wakeword_backend: "phrase"
    wake_words: "hey otto"     # for "phrase": the trigger phrase ("hey" is optional to say)
    wake_word_sensitivity: 0.6
    wake_greeting: false       # speak "what can I do?" on wake (off = just listen silently)
    wake_debounce_seconds: 3.0 # ignore repeat wake fires within this window (anti-spam)
    # Reliable hands-free "hey otto": train a free openWakeWord model (see docs/HEY_OTTO.md),
    # then set backend "oww" and point here (scripts/install_wake_word.sh does this for you).
    oww_model_path: ""         # e.g. ~/Library/Application Support/Otto/hey_otto.onnx
    oww_inference_framework: "onnx"   # "onnx" or "tflite" (match the model file)

  tts:
    # "system" = macOS `say` (default, zero setup) · "kokoro" = local neural voice (offline,
    # no key; run `python -m otto.voice.fetch_kokoro` once) · "elevenlabs" = cloud (needs key)
    engine: "system"
    voice: ""                  # macOS `say` voice name (engine "system")
    kokoro_voice: "af_heart"   # Kokoro voice id (engine "kokoro"); see otto/voice/tts.py
    kokoro_speed: 1.0          # Kokoro speaking speed
    kokoro_model_dir: ""       # blank = ~/Library/Application Support/Otto/models/kokoro

  hotkey:
    # Global push-to-talk hotkey. Works in the packaged app (main-thread NSEvent monitor).
    # Off by default; needs macOS Input Monitoring permission when enabled.
    enabled: false
    push_to_talk: "<cmd>+<shift>+j"
