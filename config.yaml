# Otto configuration — WIRING only (how voice/UI flows).
# Agent behavior (MCP servers, subagents, skills, CLAUDE.md, permissions) comes from your
# OWN Claude config — Otto loads it. Env vars (OTTO_*) override these values.
# When installed, the live copy lives at ~/Library/Application Support/Otto/config.yaml
# and is editable from the menu bar → Settings.

server:
  host: "127.0.0.1"
  port: 8000

brain:
  type: claude
  model: ""                    # blank = use Claude's default model
  # How Claude's permission prompts (for consequential tools) are handled:
  #   voice -> Otto asks you   |   auto -> approve   |   deny -> reject
  permission: voice
  project_dir: "~"             # current project = the brain's working directory
  projects: []                 # pinned projects for the menu-bar switcher
  extra_dirs: []               # extra readable dirs beyond the project (~ expanded)
  use_claude_config: true      # load your ~/.claude settings, MCP, subagents, skills, CLAUDE.md
  continue_conversation: true  # resume the project's most recent Claude session
  register_mcp: true           # expose /mcp so `claude mcp add otto` gives Claude voice+screen

voice:
  input_enabled: true          # microphone / wake word / push-to-talk
  output_enabled: true         # speak replies

  stt:
    model: "small.en"          # faster-whisper: tiny/base/small/medium/large-v3 (+ .en)
    language: "en"
    # Wake word backend:
    #   phrase      -> software wake word: any phrase, no account/models (default).
    #                  Otto transcribes continuously and acts when speech starts with it.
    #   oww         -> openWakeWord built-in phrases only ("hey jarvis", "alexa", …).
    #   pvporcupine -> custom .ppn keyword; set wake_words to the .ppn path + a
    #                  PICOVOICE_ACCESS_KEY (Picovoice signup needs a work email).
    wakeword_backend: "phrase"
    wake_words: "hey otto"     # for "phrase": the trigger phrase ("hey" is optional to say)
    wake_word_sensitivity: 0.6
    # Reliable hands-free "hey otto": train a free openWakeWord model (see docs/HEY_OTTO.md),
    # then set backend "oww" and point here (scripts/install_wake_word.sh does this for you).
    oww_model_path: ""         # e.g. ~/Library/Application Support/Otto/hey_otto.onnx
    oww_inference_framework: "onnx"   # "onnx" or "tflite" (match the model file)

  tts:
    engine: "system"           # "system" (local macOS voice) or "elevenlabs" (needs key)
    voice: ""

  hotkey:
    push_to_talk: "<cmd>+<shift>+j"
