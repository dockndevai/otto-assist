name: Build macOS app (Orrin.dmg)

# Builds the standalone Orrin.app + Orrin.dmg on a macOS (Apple Silicon) runner.
# - Manual: Actions tab → "Run workflow".
# - Automatic: pushing a tag like v0.2.2 builds and attaches the DMG to that release.
#
# The build is UNSIGNED (no Apple Developer account wired up yet): to sign + notarize,
# add SIGN_ID + a notarization keychain profile and pass them through to build.sh.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write        # needed to attach the DMG to the release on a tag build

jobs:
  build:
    runs-on: macos-14    # Apple Silicon (arm64), matches the target machines
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          # build.sh expects the app to run from .venv (voice + menu-bar extras).
          .venv/bin/pip install -e ".[voice,app]"

      - name: Build Orrin.app + Orrin.dmg
        run: bash packaging/pyinstaller/build.sh

      - name: Show build output
        run: |
          ls -lh dist
          echo "app: $(du -sh dist/Orrin.app | cut -f1) · dmg: $(du -sh dist/Orrin.dmg | cut -f1)"

      - name: Upload DMG as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orrin-dmg
          path: dist/Orrin.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Attach DMG to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" dist/Orrin.dmg --clobber \
            || gh release create "$TAG" dist/Orrin.dmg --title "Orrin $TAG" --notes "Automated build from CI."
