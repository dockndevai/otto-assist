[project]
name = "otto-assist"
version = "0.2.32"
description = "A realtime, voice-driven personal assistant that wraps Claude as its brain."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dockndevai" }]
dependencies = [
    # Brain
    "claude-agent-sdk>=0.2.140",
    # Web dashboard + event bus + MCP-for-Claude endpoint
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=2.0",
    "httpx>=0.27",
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Voice stack — installed separately so the text path works without a mic.
voice = [
    "RealtimeSTT>=0.3.0",   # VAD + wake word + streaming (ears)
    "faster-whisper>=1.0",  # the actual Whisper transcription engine
    "silero-vad>=5.1",      # voice-activity detection model (RealtimeSTT needs it)
    "onnxruntime>=1.17",    # runs the silero VAD / wake-word ONNX models
    "openwakeword>=0.6",    # "hey jarvis" wake word (oww backend)
    "pvporcupine>=3.0",     # custom wake word e.g. "hey otto" (needs PICOVOICE_ACCESS_KEY)
    "EfficientWord-Net>=1.0",  # few-shot custom wake word — record your phrase, no account
    "RealtimeTTS>=0.4.0",   # streaming text-to-speech (mouth)
    "pyttsx3>=2.90",        # local system-voice backend for RealtimeTTS
    "pynput>=1.7",          # global push-to-talk hotkey
]
# macOS menu bar app
app = [
    "rumps>=0.4",                    # menu bar UI
    "pyobjc-framework-WebKit>=10",   # in-app dashboard window (WKWebView) instead of a browser
    "pyobjc-framework-Vision>=10",   # on-device OCR for the "read the screen" local action (optional)
]
# Local neural voice (Kokoro) — optional, offline, no API key. Model files fetched separately
# with `python -m otto.voice.fetch_kokoro`. espeak-ng ships bundled via espeakng-loader.
neural-voice = [
    "kokoro-onnx>=0.4",              # Kokoro TTS on onnxruntime (bundled espeak-ng)
    "soundfile>=0.12",               # write synthesized audio to a WAV for afplay
]
# Faster transcription on Apple Silicon (voice.stt.transcriber: "mlx"). Falls back to
# faster-whisper automatically when absent, so this extra is optional and macOS/arm64 only.
mlx-stt = [
    "mlx-whisper>=0.4",              # Whisper on the Apple-Silicon GPU (MLX) — ~5-7x faster
]
# Headless dashboard smoke test (scripts/dashboard_smoke.py). After install, fetch the browser
# with `python -m playwright install chromium`. Opt-in in the suite via OTTO_DASHBOARD_SMOKE=1.
dashboard-test = [
    "playwright>=1.40",
]

[project.scripts]
otto = "run:main"
otto-menubar = "otto.menubar:main"

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.package-data]
# Ship the menu-bar icons AND the dashboard web assets (html/css/js/json/png) so a normal
# (non-editable) install has a working dashboard. Without web/*, StaticFiles(WEB_DIR) fails.
otto = ["assets/*"]
"otto.server" = ["web/*"]

[tool.setuptools.packages.find]
include = ["otto*"]
