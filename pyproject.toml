[project]
name = "otto-assist"
version = "0.1.0"
description = "A realtime, voice-driven personal assistant that wraps Claude as its brain."
requires-python = ">=3.11"
dependencies = [
    # Brain
    "claude-agent-sdk>=0.2.140",
    # Web dashboard + event bus
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Voice stack — installed separately so the text path works without a mic.
voice = [
    "RealtimeSTT>=0.3.0",   # VAD + wake word + streaming (ears)
    "faster-whisper>=1.0",  # the actual Whisper transcription engine
    "openwakeword>=0.6",    # "hey jarvis" wake word (oww backend)
    "RealtimeTTS>=0.4.0",   # streaming text-to-speech (mouth)
    "pyttsx3>=2.90",        # local system-voice backend for RealtimeTTS
    "pynput>=1.7",          # global push-to-talk hotkey
]
# macOS menu bar app
app = [
    "rumps>=0.4",           # menu bar UI
]

[project.scripts]
otto = "run:main"
otto-menubar = "otto.menubar:main"

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
include = ["otto*"]
