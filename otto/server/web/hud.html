<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orrin</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none; font: 13px -apple-system, system-ui, sans-serif; }
  #bar { position: fixed; inset: 6px; display: flex; align-items: center; gap: 11px;
    padding: 0 14px; border-radius: 14px; cursor: grab;
    background: rgba(17,19,24,.85); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.09); box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  #bar:active { cursor: grabbing; }

  /* Equalizer visualizer (procedural, per-state) */
  .eq { display: flex; align-items: center; gap: 3px; height: 26px; flex: 0 0 auto; }
  .eq i { width: 3px; height: 100%; border-radius: 2px; background: var(--c, #38bdf8);
    transform: scaleY(.22); transform-origin: center; box-shadow: 0 0 6px var(--c, #38bdf8); }
  .eq.on i { animation: eq var(--spd, .95s) ease-in-out infinite alternate; }
  .eq i:nth-child(1){animation-delay:-.0s} .eq i:nth-child(2){animation-delay:-.28s}
  .eq i:nth-child(3){animation-delay:-.56s} .eq i:nth-child(4){animation-delay:-.14s}
  .eq i:nth-child(5){animation-delay:-.42s} .eq i:nth-child(6){animation-delay:-.7s}
  .eq i:nth-child(7){animation-delay:-.35s}
  @keyframes eq { from { transform: scaleY(.22) } to { transform: scaleY(1) } }
  @media (prefers-reduced-motion: reduce) { .eq.on i { animation: none; transform: scaleY(.5) } }

  #txt { flex: 1 1 auto; min-width: 0; }
  #top { display: flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: .07em;
    text-transform: uppercase; color: #aeb4c2; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, #64748b);
    box-shadow: 0 0 7px var(--c, #64748b); }
  #line { font-size: 13.5px; line-height: 1.3; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: #f2f4f9; margin-top: 2px; }
  #line.dim { opacity: .5; }
  #line .who { opacity: .5; }
</style>
</head>
<body>
  <div id="bar">
    <div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div id="txt">
      <div id="top"><span id="dot"></span><span id="label">Ready</span></div>
      <div id="line" class="dim">Say something…</div>
    </div>
  </div>
<script>
(() => {
  const bar = document.getElementById("bar"), eq = document.getElementById("eq");
  const dot = document.getElementById("dot"), labelEl = document.getElementById("label");
  const lineEl = document.getElementById("line");

  // color + eq behavior + label per state
  const S = {
    idle:      { c: "#64748b", on: false, spd: "1.1s", label: "Ready" },
    listening: { c: "#22c55e", on: true,  spd: ".55s", label: "Listening" },
    thinking:  { c: "#f59e0b", on: true,  spd: ".9s",  label: "Thinking" },
    working:   { c: "#f59e0b", on: true,  spd: ".9s",  label: "Working" },
    speaking:  { c: "#a78bfa", on: true,  spd: ".5s",  label: "Speaking" },
    sleeping:  { c: "#475569", on: false, spd: "2s",   label: "Sleeping" },
    signed_out:{ c: "#ef4444", on: false, spd: "1s",   label: "Signed out" },
  };
  let state = "idle", hold = null;

  function applyState(s) {
    s = (s || "idle"); if (s.startsWith("error")) s = "signed_out";
    if (!S[s]) s = "idle";
    state = s;
    const cfg = S[s];
    bar.style.setProperty("--c", cfg.c);
    eq.style.setProperty("--c", cfg.c);
    eq.style.setProperty("--spd", cfg.spd);
    eq.classList.toggle("on", cfg.on);
    labelEl.textContent = cfg.label;
    if (!hold) setLine(defaultLine(), true);
  }
  function defaultLine() {
    return ({ listening: "Listening…", thinking: "Working on it…", working: "Working…",
              speaking: "Speaking…", sleeping: "Napping — say “Otto”",
              signed_out: "Run claude, then /login", idle: "Say something…" })[state] || "";
  }
  function setLine(html, dim) { lineEl.innerHTML = html; lineEl.classList.toggle("dim", !!dim); }
  function esc(t) { const d = document.createElement("div"); d.textContent = t || ""; return d.innerHTML; }
  function activity(html, holdMs) {          // transient "what's going on" line
    if (hold) clearTimeout(hold);
    setLine(html, false);
    hold = holdMs ? setTimeout(() => { hold = null; setLine(defaultLine(), true); }, holdMs) : null;
  }

  function onEvent(ev) {
    switch (ev.type) {
      case "status": applyState(ev.state); break;
      case "auth": if (ev.signed_out) applyState("signed_out"); break;
      case "transcript_partial":
        if (ev.role === "user") activity('<span class="who">you</span> ' + esc(ev.text), 0); break;
      case "transcript_final":
        if (ev.role === "user") activity('<span class="who">you</span> ' + esc(ev.text), 5000);
        else activity(esc(ev.text), 6000); break;
      case "assistant_delta":
        if (ev.text) { const cur = lineEl.textContent || ""; activity(esc((cur + ev.text).slice(-140)), 0); } break;
      case "tool_use":
        activity('<span class="who">→</span> ' + esc(ev.detail ? ev.name + " · " + ev.detail : ev.name), 0); break;
      case "research":
        if (ev.active) activity('<span class="who">researching</span> ' + esc(ev.name || ""), 0);
        else if (!hold) setLine(defaultLine(), true);
        break;
    }
  }

  bar.addEventListener("pointerdown", () => {
    try { window.webkit.messageHandlers.drag.postMessage(1); } catch {}
  });
  function connect() {
    let ws; try { ws = new WebSocket(`ws://${location.host}/ws`); } catch { return; }
    ws.onmessage = (e) => { let ev; try { ev = JSON.parse(e.data); } catch { return; } onEvent(ev); };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  applyState("idle");
  connect();
})();
</script>
</body>
</html>
