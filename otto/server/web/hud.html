<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orrin</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none; font: 13px -apple-system, system-ui, sans-serif; }
  /* macOS HUD-window material: a dark vibrant pill (stays legible over light or dark apps). */
  #bar { position: fixed; inset: 6px; display: flex; align-items: center; gap: 11px;
    padding: 0 14px; border-radius: 13px; cursor: grab;
    background: rgba(30,30,32,.72); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
    border: 1px solid rgba(255,255,255,.12); box-shadow: 0 8px 28px rgba(0,0,0,.44); }
  #bar:active { cursor: grabbing; }

  /* Equalizer visualizer (procedural, per-state) */
  .eq { display: flex; align-items: center; gap: 3px; height: 26px; flex: 0 0 auto; }
  .eq i { width: 3px; height: 100%; border-radius: 2px; background: var(--c, #38bdf8);
    transform: scaleY(.22); transform-origin: center; box-shadow: 0 0 6px var(--c, #38bdf8); }
  .eq.on i { animation: eq var(--spd, .95s) ease-in-out infinite alternate; }
  .eq i:nth-child(1){animation-delay:-.0s} .eq i:nth-child(2){animation-delay:-.28s}
  .eq i:nth-child(3){animation-delay:-.56s} .eq i:nth-child(4){animation-delay:-.14s}
  .eq i:nth-child(5){animation-delay:-.42s} .eq i:nth-child(6){animation-delay:-.7s}
  .eq i:nth-child(7){animation-delay:-.35s}
  @keyframes eq { from { transform: scaleY(.22) } to { transform: scaleY(1) } }
  @media (prefers-reduced-motion: reduce) { .eq.on i { animation: none; transform: scaleY(.5) } }

  #txt { flex: 1 1 auto; min-width: 0; }
  #top { display: flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: .06em;
    text-transform: uppercase; color: #a0a0a6; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, #64748b);
    box-shadow: 0 0 7px var(--c, #64748b); }
  #line { font-size: 13.5px; line-height: 1.3; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: #f5f5f7; margin-top: 2px; }
  #line.dim { opacity: .5; }
  #line .who { opacity: .5; }

  /* Notch dock: top-center, click-through, tucks into the notch and auto-hides to a sliver when
     idle; drops down and expands on activity. (Corner pill styles above are unchanged.) */
  body.notch #bar { inset: auto; left: 50%; top: 0; transform: translateX(-50%);
    width: 360px; height: 54px; margin-top: 7px; cursor: default; overflow: hidden;
    transition: width .34s cubic-bezier(.22,1,.36,1), height .34s cubic-bezier(.22,1,.36,1),
      margin-top .34s cubic-bezier(.22,1,.36,1), border-radius .34s, padding .34s, opacity .28s; }
  body.notch #bar[data-mode="collapsed"] { width: 108px; height: 9px; margin-top: 0; padding: 0;
    border-radius: 0 0 10px 10px; }
  body.notch #bar[data-mode="collapsed"] .eq,
  body.notch #bar[data-mode="collapsed"] #txt { opacity: 0; transition: opacity .18s; }
  body.notch #bar[data-mode="collapsed"]::after { content: ""; position: absolute; inset: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, transparent, var(--c, #64748b), transparent); }
</style>
</head>
<body>
  <div id="bar">
    <div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div id="txt">
      <div id="top"><span id="dot"></span><span id="label">Ready</span></div>
      <div id="line" class="dim">Say something…</div>
    </div>
  </div>
<script>
(() => {
  const bar = document.getElementById("bar"), eq = document.getElementById("eq");
  const dot = document.getElementById("dot"), labelEl = document.getElementById("label");
  const lineEl = document.getElementById("line");

  // color + eq behavior + label per state
  const S = {
    idle:      { c: "#8e8e93", on: false, spd: "1.1s", label: "Ready" },
    listening: { c: "#30d158", on: true,  spd: ".55s", label: "Listening" },
    thinking:  { c: "#ff9f0a", on: true,  spd: ".9s",  label: "Thinking" },
    working:   { c: "#ff9f0a", on: true,  spd: ".9s",  label: "Working" },
    speaking:  { c: "#5e5ce6", on: true,  spd: ".5s",  label: "Speaking" },
    sleeping:  { c: "#636366", on: false, spd: "2s",   label: "Sleeping" },
    signed_out:{ c: "#ff453b", on: false, spd: "1s",   label: "Signed out" },
  };
  let state = "idle", hold = null;

  // Notch dock: top-center, auto-hide to a sliver when idle, expand on activity.
  const Q = new URLSearchParams(location.search);
  const NOTCH = Q.get("mode") === "notch";
  const AUTOHIDE = NOTCH && Q.get("autohide") !== "0";
  const HIDE_MS = Math.max(0.8, parseFloat(Q.get("delay") || "2.5")) * 1000;
  let hideT = null;
  if (NOTCH) document.body.classList.add("notch");
  function expand() { if (!NOTCH) return; clearTimeout(hideT); bar.dataset.mode = "expanded"; }
  function scheduleCollapse() {
    if (!NOTCH || !AUTOHIDE) { return; }
    clearTimeout(hideT);
    hideT = setTimeout(() => { bar.dataset.mode = "collapsed"; }, HIDE_MS);
  }
  const ACTIVE = { listening: 1, thinking: 1, working: 1, speaking: 1, signed_out: 1 };

  function applyState(s) {
    s = (s || "idle"); if (s.startsWith("error")) s = "signed_out";
    if (!S[s]) s = "idle";
    state = s;
    const cfg = S[s];
    bar.style.setProperty("--c", cfg.c);
    eq.style.setProperty("--c", cfg.c);
    eq.style.setProperty("--spd", cfg.spd);
    eq.classList.toggle("on", cfg.on);
    labelEl.textContent = cfg.label;
    if (!hold) setLine(defaultLine(), true);
    if (NOTCH) { ACTIVE[state] ? expand() : scheduleCollapse(); }
  }
  function defaultLine() {
    return ({ listening: "Listening…", thinking: "Working on it…", working: "Working…",
              speaking: "Speaking…", sleeping: "Napping — say “Otto”",
              signed_out: "Run claude, then /login", idle: "Say something…" })[state] || "";
  }
  function setLine(html, dim) { lineEl.innerHTML = html; lineEl.classList.toggle("dim", !!dim); }
  function esc(t) { const d = document.createElement("div"); d.textContent = t || ""; return d.innerHTML; }
  function activity(html, holdMs) {          // transient "what's going on" line
    if (hold) clearTimeout(hold);
    setLine(html, false);
    if (NOTCH) expand();
    hold = holdMs ? setTimeout(() => {
      hold = null; setLine(defaultLine(), true);
      if (NOTCH && !ACTIVE[state]) scheduleCollapse();
    }, holdMs) : null;
  }

  function onEvent(ev) {
    switch (ev.type) {
      case "status": applyState(ev.state); break;
      case "auth": if (ev.signed_out) applyState("signed_out"); break;
      case "transcript_partial":
        if (ev.role === "user") activity('<span class="who">you</span> ' + esc(ev.text), 0); break;
      case "transcript_final":
        if (ev.role === "user") activity('<span class="who">you</span> ' + esc(ev.text), 5000);
        else activity(esc(ev.text), 6000); break;
      case "assistant_delta":
        if (ev.text) { const cur = lineEl.textContent || ""; activity(esc((cur + ev.text).slice(-140)), 0); } break;
      case "tool_use":
        activity('<span class="who">→</span> ' + esc(ev.detail ? ev.name + " · " + ev.detail : ev.name), 0); break;
      case "research":
        if (ev.active) activity('<span class="who">researching</span> ' + esc(ev.name || ""), 0);
        else if (!hold) setLine(defaultLine(), true);
        break;
    }
  }

  bar.addEventListener("pointerdown", () => {
    try { window.webkit.messageHandlers.drag.postMessage(1); } catch {}
  });
  function connect() {
    let ws; try { ws = new WebSocket(`ws://${location.host}/ws`); } catch { return; }
    ws.onmessage = (e) => { let ev; try { ev = JSON.parse(e.data); } catch { return; } onEvent(ev); };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  if (NOTCH) bar.dataset.mode = "collapsed";   // start tucked away; expand when something happens
  applyState("idle");
  connect();
})();
</script>
</body>
</html>
