<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orrin</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none; }
  /* The whole surface is click-through except the character (set by the host panel). */
  #stage { position: fixed; inset: 0; display: flex; align-items: flex-end;
    justify-content: center; }
  #char { position: relative; width: 100%; height: 100%; display: flex;
    align-items: flex-end; justify-content: center; filter: drop-shadow(0 6px 12px rgba(0,0,0,.28));
    animation: bob 4.2s ease-in-out infinite; transform-origin: 50% 100%; }
  #char.speaking { animation: bob 3s ease-in-out infinite; }
  #char.listening { animation: bob 2.4s ease-in-out infinite; }
  #char.sleeping { animation: bob 6s ease-in-out infinite; }   /* slow, calm breathing */
  /* Walking waddle while roaming — reads as walking for a front-facing character (no leg frames). */
  #char.walking { animation: waddle .36s ease-in-out infinite !important; }
  @keyframes waddle {
    0%   { transform: translateY(0)     rotate(-3.5deg) scaleX(var(--face,1)); }
    50%  { transform: translateY(-6%)   rotate(3.5deg)  scaleX(var(--face,1)); }
    100% { transform: translateY(0)     rotate(-3.5deg) scaleX(var(--face,1)); }
  }
  /* "Zzz" while napping (watch mode) */
  #zzz { position: absolute; top: 6%; left: 62%; font: 700 22px/1 -apple-system, system-ui, sans-serif;
    color: #cbd5e1; opacity: 0; pointer-events: none; }
  #zzz.on { opacity: 1; }
  #zzz span { display: inline-block; opacity: 0; animation: zfloat 3s ease-in-out infinite; }
  #zzz span:nth-child(2) { animation-delay: .6s; font-size: .8em; }
  #zzz span:nth-child(3) { animation-delay: 1.2s; font-size: .64em; }
  @keyframes zfloat { 0% { opacity: 0; transform: translate(0, 6px) } 30% { opacity: .9 }
    100% { opacity: 0; transform: translate(10px, -22px) } }
  #char img { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    max-height: 100%; max-width: 100%; width: auto; height: auto; opacity: 0;
    transition: opacity .35s ease; image-rendering: -webkit-optimize-contrast; }
  #char img.on { opacity: 1; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2.2%) } }
  @media (prefers-reduced-motion: reduce) { #char { animation: none !important; } }
  /* Tap ripple + a soft glow that tints by state. */
  #halo { position: absolute; bottom: 2%; left: 50%; transform: translateX(-50%);
    width: 62%; height: 10%; border-radius: 50%; filter: blur(14px); opacity: .5;
    background: var(--glow, #38bdf8); transition: background .3s, opacity .3s; }
  /* Demo controls (only with ?demo=1) */
  #demo { position: fixed; top: 8px; left: 8px; display: none; gap: 6px; flex-wrap: wrap;
    font: 12px/1.4 -apple-system, system-ui, sans-serif; }
  #demo.on { display: flex; }
  #demo button { padding: 4px 8px; border-radius: 8px; border: 1px solid #8888;
    background: #fff8; cursor: pointer; }
</style>
</head>
<body>
  <div id="demo">
    <button data-s="idle">idle</button>
    <button data-s="listening">listening</button>
    <button data-s="thinking">thinking</button>
    <button data-s="speaking">speaking</button>
    <button data-s="sleeping">sleeping</button>
    <button data-s="signed_out">signed_out</button>
  </div>
  <div id="stage"><div id="char"><div id="halo"></div>
    <div id="zzz"><span>z</span><span>z</span><span>z</span></div></div></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const pack = params.get("pack") || "orrin";
  const charEl = document.getElementById("char");
  const haloEl = document.getElementById("halo");
  const GLOW = { idle:"#38bdf8", listening:"#22c55e", thinking:"#f59e0b",
                 working:"#f59e0b", speaking:"#a78bfa", signed_out:"#ef4444", sleeping:"#64748b" };
  const zzzEl = document.getElementById("zzz");

  const imgs = {};                 // key -> <img>
  let manifest = null, state = "idle", blinkTimer = null, mouthTimer = null;

  function ensureImg(file) {
    if (imgs[file]) return imgs[file];
    const im = new Image();
    im.src = `characters/${pack}/${file}`;
    charEl.appendChild(im);
    imgs[file] = im;
    return im;
  }
  function show(file) {
    const target = imgs[file];
    if (!target) return;
    for (const k in imgs) imgs[k].classList.toggle("on", imgs[k] === target);
  }
  function stopTimers() {
    if (blinkTimer) { clearTimeout(blinkTimer); blinkTimer = null; }
    if (mouthTimer) { clearInterval(mouthTimer); mouthTimer = null; }
  }
  function frameFor(s) { return (manifest.states && manifest.states[s]) || manifest.states.idle; }

  function setState(s) {
    s = (s || "idle");
    if (s.startsWith("error")) s = "signed_out";
    if (!manifest.states[s]) s = (s === "starting") ? "idle" : (manifest.states[s] ? s : "idle");
    state = s;
    stopTimers();
    charEl.className = ["speaking", "listening", "sleeping"].includes(s) ? s : "";
    zzzEl.classList.toggle("on", s === "sleeping");
    haloEl.style.setProperty("--glow", GLOW[s] || GLOW.idle);
    haloEl.style.opacity = s === "idle" ? ".4" : (s === "sleeping" ? ".2" : ".7");
    // One frame per state, cross-faded. We deliberately do NOT rapid-swap frames (blink loop /
    // mouth flap): the generated frames aren't pixel-aligned, so swapping made the whole body
    // jump ("flickering"). Liveliness comes from the smooth CSS bob (faster when speaking) + the
    // glow. (Smooth blink/lip-sync needs pixel-aligned frames or a rigged model — a later step.)
    show(frameFor(s));
  }
  window.orrinSetState = setState;   // host/demo hook
  // Walking waddle while the native panel glides. dir: -1 left, 1 right, 0 stop.
  window.orrinWalk = (dir) => {
    if (dir) charEl.style.setProperty("--face", dir < 0 ? "-1" : "1");
    charEl.classList.toggle("walking", !!dir);
  };

  async function boot() {
    manifest = await fetch(`characters/${pack}/character.json`,
                           { cache: "no-store" }).then(r => r.json());
    // Preload every frame the manifest can show.
    const files = new Set(Object.values(manifest.states || {}));
    if (manifest.blink) files.add(manifest.blink);
    if (manifest.mouth) { files.add(manifest.mouth.closed); files.add(manifest.mouth.open); }
    files.forEach(ensureImg);
    setState("idle");
    connect();
    if (params.has("demo")) {
      const d = document.getElementById("demo"); d.classList.add("on");
      d.addEventListener("click", e => { const s = e.target.dataset.s; if (s) setState(s); });
    }
  }

  function connect() {
    let ws;
    try { ws = new WebSocket(`ws://${location.host}/ws`); } catch { return; }
    ws.onmessage = (e) => {
      let ev; try { ev = JSON.parse(e.data); } catch { return; }
      if (ev.type === "status") setState(ev.state);
      else if (ev.type === "auth" && ev.signed_out) setState("signed_out");
    };
    ws.onclose = () => setTimeout(connect, 2000);   // reconnect if the backend restarts
  }

  boot();
})();
</script>
</body>
</html>
