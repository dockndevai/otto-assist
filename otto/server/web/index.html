<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- dashboard CSP: own assets + Google Fonts + WS/API; block remote scripts/beacons -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-src 'self'; base-uri 'none'; form-action 'self'" />
  <title>Orrin — your Claude, by voice</title>
  <meta name="description" content="Orrin — a voice & a screen for the Claude you already run." />
  <meta name="theme-color" content="#eef2f8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png" />
  <link rel="apple-touch-icon" href="/static/icon-180.png" />
  <link rel="manifest" href="/static/manifest.json" />
  <script>try{var v=localStorage.getItem('orrin-variant');if(v)document.documentElement.setAttribute('data-v',v);}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="aurora"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
  <div class="app">
    <header class="bar">
      <div class="brand"><span class="dot"></span>Orrin</div>
      <span class="pill" id="statePill"><i id="stateDot"></i><span id="statePillTxt">Ready</span></span>
      <span class="pill hideSm" id="projPill" style="color:var(--faint)">—</span>
      <div class="spacer"></div>
      <div class="sys" id="sys">
        <span class="si" id="siReady" title="Setup"><span class="ico">✓</span><span class="v">ready</span></span>
        <span class="si" id="siMic" title="Microphone"><span class="ico">🎙</span><span class="v">on</span></span>
      </div>
      <div class="seg" id="seg">
        <button data-v="aurora" class="on">Aurora</button><button data-v="mint">Mint</button>
        <button data-v="ember">Ember</button><button data-v="ice">Ice</button>
      </div>
      <button class="gbtn" id="muteMic" title="Mute microphone">🎙</button>
      <button class="gbtn" id="muteVoice" title="Mute voice">🔊</button>
      <button class="gbtn stop" id="stopBtn" title="Stop (halt speech & task)">⏹</button>
      <button class="gbtn" id="settingsBtn" title="Settings">⚙</button>
    </header>

    <div class="stage">
      <div class="float" id="float"></div>
      <div class="center">
        <div class="orb"><div class="halo"></div><canvas id="orb" width="480" height="480"></canvas></div>
        <div><h1 id="greet">Hello</h1><div class="state" id="state" style="margin-top:6px"><span>Connecting…</span></div></div>
      </div>
      <div class="memtag" id="memtag"><span class="mp"></span><span id="memtxt">saved to memory</span></div>

      <form class="dock" id="dock">
        <input id="cmdInput" autocomplete="off" placeholder="Say “Otto…”, or type a command" aria-label="command" />
        <button class="go" type="submit" title="Send">➤</button>
      </form>
      <div class="conn" id="conn">Reconnecting…</div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
