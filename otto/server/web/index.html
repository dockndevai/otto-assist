<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Otto</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app" id="app">

    <header class="hud">
      <div class="brand"><span class="logo">🤖</span> Otto <span class="ver">JARVIS</span></div>
      <div class="hudstate">
        <div class="wave" id="wave"></div>
        <span class="hudlabel" id="heroState">Ready</span>
      </div>
      <div class="hud-right">
        <span class="proj" id="proj">—</span>
        <button class="hbtn" id="chatToggle" title="Conversation">💬</button>
        <a class="hbtn" href="/settings" title="Settings">⚙</a>
      </div>
    </header>

    <main class="stage">
      <iframe id="canvas" sandbox="allow-scripts" title="canvas"></iframe>
      <div class="idle" id="idle">
        <div class="orb" id="orb"></div>
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date"></div>
        <div class="hello">How can I help?</div>
      </div>
    </main>

    <footer class="control">
      <button class="mic" id="mic" title="Click, then speak — or just talk"><span>🎤</span></button>
      <form class="composer" id="composer">
        <input id="input" autocomplete="off" placeholder="Ask Otto…" />
        <button type="submit">Send</button>
      </form>
      <div class="hint" id="heroSub">click the mic or just talk</div>
    </footer>

    <aside class="drawer" id="drawer">
      <div class="drawer-head">
        <span>CONVERSATION</span>
        <button class="dclose" id="chatClose" title="Close">✕</button>
      </div>
      <div class="transcript" id="transcript"></div>
    </aside>

  </div>
  <script src="/static/app.js"></script>
</body>
</html>
